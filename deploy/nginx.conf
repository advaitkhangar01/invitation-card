# Nginx configuration for Isha & Ashish Royal Wedding Invitation
# Target: Hostinger Ubuntu VPS (Nginx 1.18+)
# Location: /etc/nginx/sites-available/wedding-invitation

server {
    listen 80;
    listen [::]:80;
    server_name yourdomain.com www.yourdomain.com;

    # Enforce automatic HTTPS redirect once SSL certificate is active
    # return 301 https://$host$request_uri;

    root /var/www/wedding-invitation/dist;
    index index.html;

    # Gzip Compression for minimal mobile data consumption
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml
        model/gltf-binary
        model/gltf+json;

    # Browser Cache Controls for static assets, fonts, images and 3D models
    location ~* \.(?:css|js|woff2?|svg|png|jpg|jpeg|gif|ico|webp|glb|gltf|obj)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # SPA Fallback & HTML no-cache for instant updates
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header X-Frame-Options "SAMEORIGIN";
        add_header X-Content-Type-Options "nosniff";
        add_header Referrer-Policy "strict-origin-when-cross-origin";
    }

    error_page 404 /index.html;
}

