<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%" fill="none">
  <!-- Outer decorative delicate double ring -->
  <circle cx="80" cy="80" r="76" stroke="#B69A69" stroke-width="1.2" stroke-opacity="0.75" />
  <circle cx="80" cy="80" r="72" stroke="#B69A69" stroke-width="0.8" stroke-dasharray="2 2" stroke-opacity="0.6" />
  
  <!-- Subtle leaf flourishes on north, south, east, west -->
  <path d="M80 4 C83 10 85 14 80 18 C75 14 77 10 80 4Z" fill="#B69A69" fill-opacity="0.7" />
  <path d="M80 156 C83 150 85 146 80 142 C75 146 77 150 80 156Z" fill="#B69A69" fill-opacity="0.7" />
  <path d="M4 80 C10 83 14 85 18 80 C14 75 10 77 4 80Z" fill="#B69A69" fill-opacity="0.7" />
  <path d="M156 80 C150 83 146 85 142 80 C146 75 150 77 156 80Z" fill="#B69A69" fill-opacity="0.7" />

  <!-- Inner floral vine arc -->
  <path d="M40 80 C40 55 58 38 80 38 C102 38 120 55 120 80 C120 105 102 122 80 122 C58 122 40 105 40 80" stroke="#B69A69" stroke-width="0.7" stroke-opacity="0.4" />

  <!-- Letter 'I' (Left / Elegant Serif) -->
  <text x="56" y="94" font-family="'Cormorant Garamond', serif" font-size="52" font-weight="500" font-style="italic" fill="#B69A69" text-anchor="middle">I</text>

  <!-- Ampersand '&' (Center / Delicately Smaller) -->
  <text x="80" y="86" font-family="'Allura', cursive, serif" font-size="34" font-weight="400" fill="#D4BE93" text-anchor="middle">&amp;</text>

  <!-- Letter 'A' (Right / Elegant Serif) -->
  <text x="105" y="94" font-family="'Cormorant Garamond', serif" font-size="52" font-weight="500" fill="#B69A69" text-anchor="middle">A</text>
</svg>
