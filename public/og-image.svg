<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- Background Warm Ivory Gradient -->
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#FBF8F2" />
      <stop offset="100%" stop-color="#F0E8DC" />
    </radialGradient>
    <linearGradient id="goldText" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C5AA79" />
      <stop offset="50%" stop-color="#E5D6B5" />
      <stop offset="100%" stop-color="#9E814F" />
    </linearGradient>
  </defs>

  <rect width="100%" height="100%" fill="url(#bgGrad)" />

  <!-- Double Hairline Gold Border -->
  <rect x="40" y="40" width="1120" height="550" fill="none" stroke="#B69A69" stroke-width="2" stroke-opacity="0.6" />
  <rect x="52" y="52" width="1096" height="526" fill="none" stroke="#B69A69" stroke-width="1" stroke-dasharray="4 4" stroke-opacity="0.4" />

  <!-- Monogram Center Top -->
  <circle cx="600" cy="170" r="50" stroke="#B69A69" stroke-width="1.5" fill="none" stroke-opacity="0.8" />
  <text x="600" y="180" font-family="Georgia, serif" font-size="34" font-weight="600" fill="#B69A69" text-anchor="middle">I &amp; A</text>

  <!-- Title / Label -->
  <text x="600" y="270" font-family="system-ui, sans-serif" font-size="20" font-weight="600" letter-spacing="8" fill="#B69A69" text-anchor="middle">WEDDING INVITATION</text>

  <!-- Names -->
  <text x="600" y="360" font-family="Georgia, serif" font-size="78" font-weight="500" fill="#263D35" text-anchor="middle">Isha &amp; Ashish</text>

  <!-- Date & Venue -->
  <text x="600" y="440" font-family="system-ui, sans-serif" font-size="24" font-weight="500" letter-spacing="4" fill="#39332E" text-anchor="middle">THURSDAY, 17 DECEMBER 2026</text>
  <text x="600" y="480" font-family="system-ui, sans-serif" font-size="20" font-weight="400" letter-spacing="3" fill="#6E6760" text-anchor="middle">AMRIT FARMS · GUMTHALA, NAGPUR</text>
</svg>
