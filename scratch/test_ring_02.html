<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { margin: 0; background: #FAF8F5; overflow: hidden; display: flex; align-items: center; justify-content: center; height: 100vh; }
    canvas { width: 500px; height: 400px; }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "/node_modules/three/build/three.module.js",
        "three/addons/": "/node_modules/three/examples/jsm/"
      }
    }
  </script>
</head>
<body>
<div id="container" style="width: 500px; height: 400px;"></div>
<script type="module">
  import * as THREE from 'three';
  import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

  const container = document.getElementById('container');
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(40, 500 / 400, 0.1, 1000);
  camera.position.set(0, 15, 45);

  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setSize(500, 400);
  renderer.setPixelRatio(window.devicePixelRatio);
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.2;
  container.appendChild(renderer.domElement);

  const ambientLight = new THREE.AmbientLight(0xfffaed, 1.5);
  scene.add(ambientLight);

  const dirLight = new THREE.DirectionalLight(0xffeedd, 3);
  dirLight.position.set(10, 25, 20);
  scene.add(dirLight);

  const dirLight2 = new THREE.DirectionalLight(0xffdfaa, 2);
  dirLight2.position.set(-15, 10, -10);
  scene.add(dirLight2);

  const loader = new GLTFLoader();
  loader.load('/public/assets/3d/ring_02.glb', (gltf) => {
    const model = gltf.scene;
    // Compute bounding box
    const box = new THREE.Box3().setFromObject(model);
    const center = box.getCenter(new THREE.Vector3());
    const size = box.getSize(new THREE.Vector3());
    console.log('Model size:', size, 'Center:', center);
    model.position.sub(center);
    scene.add(model);
    camera.lookAt(0, 0, 0);

    renderer.render(scene, camera);
    window.RENDER_DONE = true;
  }, undefined, (err) => {
    console.error('Load error', err);
  });
</script>
</body>
</html>
