<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { margin: 0; background: #FAF8F5; overflow: hidden; display: flex; align-items: center; justify-content: center; height: 100vh; }
    canvas { width: 400px; height: 260px; }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "/node_modules/three/build/three.module.js",
        "three/addons/": "/node_modules/three/examples/jsm/"
      }
    }
  </script>
</head>
<body>
<div id="container" style="width: 400px; height: 260px;"></div>
<script type="module">
  import * as THREE from 'three';
  import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

  const container = document.getElementById('container');
  const width = 400;
  const height = 260;

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(35, width / height, 0.1, 100);
  camera.position.set(0, 4.5, 9.5);
  camera.lookAt(0, 0, 0);

  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: 'high-performance' });
  renderer.setSize(width, height);
  renderer.setPixelRatio(2);
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.15;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  container.appendChild(renderer.domElement);

  // Setup PMREM RoomEnvironment for metallic PBR reflections
  const pmremGenerator = new THREE.PMREMGenerator(renderer);
  pmremGenerator.compileEquirectangularShader();
  const roomEnv = new RoomEnvironment();
  const envMap = pmremGenerator.fromScene(roomEnv, 0.04).texture;
  scene.environment = envMap;

  // Studio Lights
  const ambientLight = new THREE.AmbientLight(0xfff7e8, 0.8);
  scene.add(ambientLight);

  const mainLight = new THREE.DirectionalLight(0xfffaed, 2.8);
  mainLight.position.set(5, 12, 8);
  mainLight.castShadow = true;
  mainLight.shadow.mapSize.width = 1024;
  mainLight.shadow.mapSize.height = 1024;
  mainLight.shadow.bias = -0.0005;
  mainLight.shadow.radius = 4;
  scene.add(mainLight);

  const warmRimLight = new THREE.DirectionalLight(0xedd3a1, 1.6);
  warmRimLight.position.set(-8, 6, -6);
  scene.add(warmRimLight);

  const softFillLight = new THREE.PointLight(0xfff5e0, 1.2, 20);
  softFillLight.position.set(0, -2, 6);
  scene.add(softFillLight);

  // Contact Shadow Plane
  const shadowPlaneGeo = new THREE.PlaneGeometry(16, 16);
  const shadowPlaneMat = new THREE.ShadowMaterial({ opacity: 0.18 });
  const shadowPlane = new THREE.Mesh(shadowPlaneGeo, shadowPlaneMat);
  shadowPlane.rotation.x = -Math.PI / 2;
  shadowPlane.position.y = -1.25;
  shadowPlane.receiveShadow = true;
  scene.add(shadowPlane);

  // Contact AO Shadow Decal (Texture)
  const canvas = document.createElement('canvas');
  canvas.width = 256; canvas.height = 256;
  const ctx = canvas.getContext('2d');
  const grad = ctx.createRadialGradient(128, 128, 10, 128, 128, 110);
  grad.addColorStop(0, 'rgba(60, 42, 16, 0.38)');
  grad.addColorStop(0.4, 'rgba(80, 56, 22, 0.20)');
  grad.addColorStop(1, 'rgba(0, 0, 0, 0)');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, 256, 256);
  const shadowTex = new THREE.CanvasTexture(canvas);
  const aoMesh = new THREE.Mesh(
    new THREE.PlaneGeometry(6.5, 3.2),
    new THREE.MeshBasicMaterial({ map: shadowTex, transparent: true, depthWrite: false })
  );
  aoMesh.rotation.x = -Math.PI / 2;
  aoMesh.position.set(0, -1.24, 0.2);
  scene.add(aoMesh);

  // Materials
  const goldMaterial = new THREE.MeshStandardMaterial({
    color: new THREE.Color('#d4af37'),
    metalness: 0.96,
    roughness: 0.14,
    envMapIntensity: 1.25,
  });

  const platinumMaterial = new THREE.MeshStandardMaterial({
    color: new THREE.Color('#f0f4f8'),
    metalness: 0.95,
    roughness: 0.1,
    envMapIntensity: 1.3,
  });

  const diamondMaterial = new THREE.MeshPhysicalMaterial({
    color: new THREE.Color('#ffffff'),
    transmission: 0.94,
    opacity: 1,
    transparent: true,
    ior: 2.417,
    roughness: 0.02,
    metalness: 0.05,
    thickness: 1.2,
    envMapIntensity: 2.2,
  });

  const ringsGroup = new THREE.Group();

  // Helper to create smooth D-shaped comfort-fit band geometry
  function createComfortFitRingGeometry(radius, width, thickness, radialSegments = 120) {
    const pts = [];
    const h = width / 2;
    const t = thickness;
    // D-shape cross section
    const steps = 16;
    for (let i = 0; i <= steps; i++) {
      const a = (i / steps) * Math.PI - Math.PI / 2;
      const x = Math.cos(a) * t;
      const y = Math.sin(a) * h;
      pts.push(new THREE.Vector2(radius + x, y));
    }
    // flat inner edge with slight bevel
    pts.push(new THREE.Vector2(radius, -h * 0.9));
    pts.push(new THREE.Vector2(radius, h * 0.9));
    const shape = new THREE.Shape(pts);
    return new THREE.LatheGeometry(pts, radialSegments);
  }

  // 1. Groom's Band (Left ring, wider, classic comfort-fit bevel)
  const groomGeo = createComfortFitRingGeometry(1.4, 0.52, 0.22, 128);
  const groomMesh = new THREE.Mesh(groomGeo, goldMaterial);
  groomMesh.castShadow = true;
  groomMesh.receiveShadow = true;
  groomMesh.position.set(-1.05, -0.15, -0.1);
  groomMesh.rotation.set(0.65, -0.42, 0.25);
  ringsGroup.add(groomMesh);

  // 2. Bride's Band (Right ring, refined contour, diamond crown)
  const brideGeo = createComfortFitRingGeometry(1.35, 0.38, 0.20, 128);
  const brideMesh = new THREE.Mesh(brideGeo, goldMaterial);
  brideMesh.castShadow = true;
  brideMesh.receiveShadow = true;
  brideMesh.position.set(0.95, -0.15, 0.2);
  brideMesh.rotation.set(0.55, 0.38, -0.22);

  // Solitaire Crown on Bride's Ring
  const crownGroup = new THREE.Group();
  crownGroup.position.set(0, 1.45, 0);

  // 6 Prongs & Gallery Collet
  const colletGeo = new THREE.TorusGeometry(0.36, 0.05, 16, 32);
  const colletMesh = new THREE.Mesh(colletGeo, platinumMaterial);
  colletMesh.rotation.x = Math.PI / 2;
  crownGroup.add(colletMesh);

  const numProngs = 6;
  for (let i = 0; i < numProngs; i++) {
    const angle = (i / numProngs) * Math.PI * 2;
    const prongGeo = new THREE.CylinderGeometry(0.045, 0.035, 0.55, 16);
    const prongMesh = new THREE.Mesh(prongGeo, platinumMaterial);
    const px = Math.cos(angle) * 0.36;
    const pz = Math.sin(angle) * 0.36;
    prongMesh.position.set(px, 0.25, pz);
    prongMesh.rotation.x = (pz / 0.36) * -0.15;
    prongMesh.rotation.z = (px / 0.36) * 0.15;
    prongMesh.castShadow = true;
    crownGroup.add(prongMesh);

    // Tip claw bead
    const clawGeo = new THREE.SphereGeometry(0.048, 12, 12);
    const clawMesh = new THREE.Mesh(clawGeo, platinumMaterial);
    clawMesh.position.set(px * 0.94, 0.52, pz * 0.94);
    crownGroup.add(clawMesh);
  }

  // Brilliant-Cut Diamond Geometry
  function createBrilliantDiamondGeometry(radius = 0.42, height = 0.52) {
    // Octagonal faceted brilliant diamond
    const facets = 12;
    const vertices = [];
    const indices = [];

    // Table center top
    vertices.push(0, height * 0.5, 0); // index 0: top table center
    // Culet bottom point
    vertices.push(0, -height * 0.5, 0); // index 1: bottom culet

    // Table rim vertices (top facet edge)
    const tableR = radius * 0.55;
    const tableY = height * 0.5;
    for (let i = 0; i < facets; i++) {
      const a = (i / facets) * Math.PI * 2;
      vertices.push(Math.cos(a) * tableR, tableY, Math.sin(a) * tableR);
    } // indices 2 .. 2+facets-1

    // Girdle vertices (widest middle band)
    const girdleR = radius;
    const girdleY = height * 0.12;
    for (let i = 0; i < facets; i++) {
      const a = (i / facets) * Math.PI * 2;
      vertices.push(Math.cos(a) * girdleR, girdleY, Math.sin(a) * girdleR);
    } // indices 2+facets .. 2+2*facets-1

    // Lower girdle band (for pavilion break)
    const lowGirdleR = radius * 0.95;
    const lowGirdleY = -height * 0.02;
    for (let i = 0; i < facets; i++) {
      const a = ((i + 0.5) / facets) * Math.PI * 2;
      vertices.push(Math.cos(a) * lowGirdleR, lowGirdleY, Math.sin(a) * lowGirdleR);
    } // indices 2+2*facets .. 2+3*facets-1

    const tOffset = 2;
    const gOffset = 2 + facets;
    const lgOffset = 2 + 2 * facets;

    // Top table star triangles
    for (let i = 0; i < facets; i++) {
      const next = (i + 1) % facets;
      indices.push(0, tOffset + i, tOffset + next);
    }

    // Crown kite & upper girdle facets (table to girdle)
    for (let i = 0; i < facets; i++) {
      const next = (i + 1) % facets;
      indices.push(tOffset + i, gOffset + i, tOffset + next);
      indices.push(tOffset + next, gOffset + i, gOffset + next);
    }

    // Girdle bevel
    for (let i = 0; i < facets; i++) {
      const next = (i + 1) % facets;
      indices.push(gOffset + i, lgOffset + i, gOffset + next);
      indices.push(gOffset + next, lgOffset + i, lgOffset + next);
    }

    // Pavilion facets (lower girdle to culet point)
    for (let i = 0; i < facets; i++) {
      const next = (i + 1) % facets;
      indices.push(lgOffset + i, 1, lgOffset + next);
    }

    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
    geo.setIndex(indices);
    geo.computeVertexNormals();
    return geo;
  }

  const diamondGeo = createBrilliantDiamondGeometry(0.38, 0.48);
  const diamondMesh = new THREE.Mesh(diamondGeo, diamondMaterial);
  diamondMesh.position.set(0, 0.28, 0);
  crownGroup.add(diamondMesh);

  brideMesh.add(crownGroup);
  ringsGroup.add(brideMesh);

  scene.add(ringsGroup);

  // Position rings group
  ringsGroup.position.set(0, 0.1, 0);

  renderer.render(scene, camera);
  window.RENDER_DONE = true;
</script>
</body>
</html>
